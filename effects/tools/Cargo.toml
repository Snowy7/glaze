[package]
name = "mypaper-effects-lab"
version = "0.1.0"
edition = "2024"
publish = false

# Isolated offline tool: never starts the wallpaper or touches desktop windows.
[workspace]

[dependencies]
anyhow = "1"
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
naga = { version = "30", features = ["wgsl-in"] }
mypaper-theme = { path = "../../crates/theme", features = ["check"] }
pollster = "0.4"
serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }

[profile.dev]
opt-level = 1
debug = false
