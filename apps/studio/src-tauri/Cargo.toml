[package]
name = "mypaper-studio"
description = "mypaper Studio: the desktop control app. Edits config.json and theme folders, starts and stops mypaper-core."
version = "0.1.0"
edition = "2024"
license = "MIT"

# Standalone: not a member of the repo's root workspace (that one is the engine).
[workspace]

[dependencies]
mypaper-config = { path = "../../../crates/config" }
mypaper-theme = { path = "../../../crates/theme" }
# The bars.json schema: crates/bars' own source, without the host's WebView2 (see that crate).
mypaper-bars-schema = { path = "../bars-schema" }

anyhow = "1"
notify = { version = "8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# `protocol-asset` serves theme previews to the webview (scoped per file at runtime).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# A second launch focuses the running Studio instead of opening another window.
tauri-plugin-single-instance = "2"
png = "0.18"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

# Embeds the built frontend instead of loading the dev server (devUrl). The
# Tauri CLI enables it for `tauri build`; plain `cargo build` does not, which
# yields a window pointing at localhost:1420.
[features]
# Unfocused capture mode + page-script hook for screenshots during development.
dev-capture = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
