[package]
name = "mypaper-studio"
description = "mypaper Studio: the desktop control app. Edits config.json and theme folders, starts and stops mypaper-core."
version = "0.1.0"
edition = "2024"
license = "MIT"

# Standalone: not a member of the repo's root workspace (that one is the engine).
[workspace]

[dependencies]
mypaper-config = { path = "../../../crates/config" }
mypaper-theme = { path = "../../../crates/theme" }

anyhow = "1"
notify = { version = "8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `protocol-asset` serves theme previews to the webview (scoped per file at runtime).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
winreg = "0.56"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
