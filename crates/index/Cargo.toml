[package]
name = "glaze-index"
description = "Opt-in native file name index and incremental folder sizes."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
memchr = "2"
memmap2 = "0.9"
rayon = "1"
globset = "0.4"
glaze-config.workspace = true
glaze-fswatch.workspace = true
glaze-tweaks.workspace = true

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true

[dev-dependencies.windows]
workspace = true
features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"]
