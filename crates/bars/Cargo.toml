[package]
name = "mypaper-bars"
description = "The shell bars: a top bar, a dock and the native taskbar's mode, with an undo journal."
version.workspace = true
edition.workspace = true
license.workspace = true

# The library is what core needs: `bars.json` and the taskbar journal's replay.
[lib]
path = "src/lib.rs"

[[bin]]
name = "mypaper-bars"
path = "src/main.rs"

[dependencies]
mypaper-config.workspace = true
mypaper-desktop = { workspace = true, features = ["webview"] }
mypaper-theme.workspace = true

anyhow.workspace = true
log.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
webview2-com = "0.39"
windows-core = "0.62"

[dependencies.windows]
workspace = true
features = [
  "ApplicationModel",
  "ApplicationModel_DataTransfer",
  "Data_Xml_Dom",
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "UI_Shell",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Wmi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
