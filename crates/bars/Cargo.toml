[package]
name = "mypaper-bars"
description = "Windows services and configuration for the native shell bars."
version.workspace = true
edition.workspace = true
license.workspace = true

# Plain Rust services used by shell, core and Studio.
[lib]
path = "src/lib.rs"

[dependencies]
mypaper-config.workspace = true
mypaper-desktop.workspace = true
mypaper-theme.workspace = true

anyhow.workspace = true
log.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
windows-core = "0.62"
windows-numerics = "0.3"

[dependencies.windows]
workspace = true
features = [
  "ApplicationModel",
  "ApplicationModel_DataTransfer",
  "Data_Xml_Dom",
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Foundation_Numerics",
  "Graphics_Effects",
  "Media_Control",
  "Storage_Streams",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "UI_Notifications",
  "UI_Notifications_Management",
  "UI_Shell",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Wmi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
