[package]
name = "glaze-shell"
description = "The native shell: one UI thread on glaze-ui. Hosts the native bars, dock, desktop widgets and the right-click menu."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glaze-plugin-api = { path = "../plugin-api" }
glaze-plugin-sdk = { path = "../plugin-sdk" }
glaze-config.workspace = true
glaze-fswatch.workspace = true
glaze-index.workspace = true
glaze-desktop.workspace = true
glaze-theme.workspace = true
glaze-tweaks.workspace = true
glaze-ui.workspace = true
glaze-glass-ipc.workspace = true
glaze-bars.workspace = true
glaze-integrations = { path = "../integrations" }
bytemuck.workspace = true
serde_json.workspace = true
resvg = { version = "0.45", default-features = false }

glaze-widgets = { path = "../widgets" }
glaze-plugin-weather = { path = "../../plugins/weather" }
serde.workspace = true
base64 = "0.22"
windows-core = "0.62"

anyhow.workspace = true
log.workspace = true

[dependencies.windows]
workspace = true
features = [
  "Globalization",
  "Devices_Radios",
  "Networking_Connectivity",
  "Networking_NetworkOperators",
  "Foundation",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Time",
  "Win32_System_Registry",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
glaze-ui = { workspace = true, features = ["golden"] }

[[example]]
name = "glaze-widget-fixture"
path = "src/widgets/live.rs"

[[example]]
name = "glaze-look-fixture"
path = "examples/look_fixture.rs"

[lints]
workspace = true
