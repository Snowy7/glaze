[package]
name = "mypaper-theme"
description = "Theme folder format: theme.json + the assets it references."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# naga checks of effect passes, shader bases and Shadertoy GLSL (`stack::check`): exactly what
# the engine compiles. The engine and Studio turn it on; other crates skip naga.
check = ["dep:naga"]

[dependencies]
anyhow.workspace = true
mypaper-config.workspace = true
serde.workspace = true
serde_json.workspace = true
# The same naga the workspace's wgpu 30 builds.
naga = { version = "30", optional = true, default-features = false, features = ["wgsl-in", "glsl-in"] }

[lints]
workspace = true
