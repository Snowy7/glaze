[package]
name = "mypaper-desktop"
description = "Win32 desktop plumbing: attach behind icons, monitors, occlusion, safe exits."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mypaper-config.workspace = true

anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
# Only for the WebView2 hosts (feature `webview`): the shared environment helper.
webview2-com = { version = "0.39", optional = true }

[features]
webview = ["dep:webview2-com"]

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
