[package]
name = "mypaper-integrations"
description = "Demand-owned native app subscriptions; no periodic polling or heartbeat tasks."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util", "macros"] }
hyper = { version = "1", features = ["client", "http1"] }
windows-future = "0.3"
windows = { workspace = true, features = [
  "ApplicationModel", "ApplicationModel_Appointments", "Foundation", "Foundation_Collections", "Media_Control",
  "Win32_Security_Cryptography",
  "UI_Notifications", "UI_Notifications_Management", "Storage_Streams", "Win32_Foundation",
  "Win32_Security_Credentials", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinHttp",
  "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Graphics_Gdi"
] }

[lints]
workspace = true
