[package]
name = "mypaper-integrations"
description = "Demand-owned native app subscriptions; no periodic polling or heartbeat tasks."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
windows-future = "0.3"
windows = { workspace = true, features = [
  "ApplicationModel", "Foundation", "Foundation_Collections", "Media_Control",
  "UI_Notifications", "UI_Notifications_Management", "Storage_Streams", "Win32_Foundation",
  "Win32_Security_Credentials", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinHttp",
  "Win32_System_ProcessStatus", "Win32_System_Threading"
] }

[lints]
workspace = true
