[package]
name = "mypaper-app-styler"
description = "Experimental: restyles the XAML inside File Explorer and Settings through XAML Diagnostics (docs/windows-styling.md, \"App styler\")."
version.workspace = true
edition.workspace = true
license.workspace = true

# The TAP DLL that XAML Diagnostics loads into Explorer and Settings, and the rules both sides share.
[lib]
name = "mypaper_app_styler"
crate-type = ["cdylib", "rlib"]

# The on-demand helper core starts while `experimental.app_styler` is on.
[[bin]]
name = "mypaper-styler"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
mypaper-config.workspace = true
mypaper-desktop.workspace = true
mypaper-inject.workspace = true
mypaper-theme.workspace = true
mypaper-tweaks.workspace = true
serde.workspace = true
serde_json.workspace = true
windows-core = "0.62"

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
]
