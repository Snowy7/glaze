[package]
name = "glaze-plugin-sdk"
description = "The one crate a Glaze plugin needs: manifest types, declarative kit views, and a typed JSON-RPC event loop (docs/plugins.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# The guest side (`guest`, wasm32 only): bindings for `crates/plugin-api/wit`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.57", default-features = false, features = ["macros", "realloc"] }
