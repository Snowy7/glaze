[package]
name = "glaze-files"
description = "On-demand native file browser built on the Glaze kit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
glaze-ui.workspace = true
glaze-config.workspace = true
glaze-theme.workspace = true
glaze-bars.workspace = true
glaze-index.workspace = true
glaze-tweaks.workspace = true
glaze-desktop.workspace = true
bytemuck.workspace = true
windows-core = "0.62"

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Ole",
  "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Registry",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_SystemServices", "Win32_System_Time", "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Controls",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_Diagnostics_Debug",
]

[lints]
workspace = true

[dev-dependencies]
glaze-ui = { workspace = true, features = ["golden"] }
