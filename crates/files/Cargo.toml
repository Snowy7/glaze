[package]
name = "mypaper-files"
description = "On-demand native file browser built on the mypaper kit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
mypaper-ui.workspace = true
mypaper-config.workspace = true
mypaper-theme.workspace = true
mypaper-bars.workspace = true
mypaper-index.workspace = true
mypaper-tweaks.workspace = true
mypaper-desktop.workspace = true
bytemuck.workspace = true
windows-core = "0.62"

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Ole",
  "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Registry",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_SystemServices", "Win32_System_Time", "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
