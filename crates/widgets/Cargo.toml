[package]
name = "glaze-widgets"
description = "Native widget services: layout, storage, media, stats, audio, icons and JSON-RPC plugins."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
glaze-config.workspace = true
glaze-theme.workspace = true
glaze-integrations = { path = "../integrations" }
glaze-plugin-sdk = { path = "../plugin-sdk" }
glaze-plugin-api = { path = "../plugin-api" }

anyhow.workspace = true
log.workspace = true
# Encodes `appIcon` results (already in the lockfile through Studio).
png = "0.18"
serde.workspace = true
serde_json.workspace = true
quick-xml = { version = "0.42.0", default-features = false }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dependencies.windows]
workspace = true
features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
