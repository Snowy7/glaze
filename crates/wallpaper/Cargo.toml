[package]
name = "mypaper-wallpaper"
description = "The wallpaper engine: renders a theme's wallpaper behind the desktop icons."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Rust hot-patching: `dx serve --hotpatch -p mypaper-wallpaper --features hotpatch`.
hotpatch = ["dep:subsecond", "dep:dioxus-devtools"]

[dependencies]
mypaper-desktop.workspace = true
mypaper-theme.workspace = true

anyhow.workspace = true
bytemuck.workspace = true
env_logger.workspace = true
log.workspace = true
notify.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
wgpu.workspace = true

subsecond = { workspace = true, optional = true }
dioxus-devtools = { workspace = true, optional = true }

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
