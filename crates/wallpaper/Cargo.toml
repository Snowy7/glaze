[package]
name = "glaze-wallpaper"
description = "The wallpaper engine: renders a theme's wallpaper behind the desktop icons."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Rust hot-patching: `dx serve --hotpatch -p glaze-wallpaper --features hotpatch`.
hotpatch = ["dep:subsecond", "dep:dioxus-devtools"]

[dependencies]
glaze-glass-ipc.workspace = true
glaze-config.workspace = true
glaze-desktop.workspace = true
glaze-fswatch.workspace = true
glaze-theme = { workspace = true, features = ["check"] }
glaze-tweaks.workspace = true
# All Liquid Glass (plates and overlays): a vendored copy of al1h3n/liquid-rust.
liquid-rust = { path = "../liquid-rust" }

anyhow.workspace = true
bytemuck.workspace = true
log.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
# naga-ir: stack effects and Shadertoy bases hand wgpu the module naga already checked.
wgpu = { workspace = true, features = ["naga-ir"] }
serde_json.workspace = true
glam.workspace = true
gltf.workspace = true
# WebView2 bindings for `web` wallpapers (0.39 is the line built on windows 0.62).
webview2-com = "0.39"
# Glass overlays (src/overlay): the window-exclusion ABI the windows crate lacks (`interface`),
# WinRT collections and async results for Windows.Graphics.Capture.
windows-core = "0.62"
windows-collections = "0.3"
windows-future = "0.3"

subsecond = { workspace = true, optional = true }
dioxus-devtools = { workspace = true, optional = true }

[dependencies.windows]
workspace = true
features = [
  # Glass overlays (src/overlay): Windows.Graphics.Capture and DirectComposition.
  "Foundation_Collections",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "UI",
  "Win32_Graphics_DirectComposition",
  "Win32_System_DataExchange",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  # The overlay spike examples only: D3D11On12 (the device comparison), DWM timing, QPC, input.
  "Win32_Graphics_Direct3D11on12",
  "Win32_Graphics_Dwm",
  "Win32_System_Performance",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
