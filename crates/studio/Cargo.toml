[package]
name = "glaze-studio"
description = "Glaze Studio: the settings app, native on glaze-ui (software Direct2D, no WebView)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "glaze-studio"
path = "src/main.rs"

[dependencies]
glaze-bars.workspace = true
glaze-config.workspace = true
glaze-desktop.workspace = true
glaze-theme = { workspace = true, features = ["check"] }
glaze-ui.workspace = true
glaze-shell = { path = "../shell" }
glaze-widgets = { path = "../widgets" }
glaze-integrations = { path = "../integrations" }
glaze-plugin-weather = { path = "../../plugins/weather" }

anyhow.workspace = true
log.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
glaze-ui = { workspace = true, features = ["golden"] }

[lints]
workspace = true
