[package]
name = "mypaper-studio"
description = "mypaper Studio: the settings app, native on mypaper-ui (software Direct2D, no WebView)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mypaper-studio"
path = "src/main.rs"

[dependencies]
mypaper-bars.workspace = true
mypaper-config.workspace = true
mypaper-desktop.workspace = true
mypaper-theme.workspace = true
mypaper-ui.workspace = true
mypaper-shell = { path = "../shell" }
mypaper-widgets = { path = "../widgets" }
mypaper-integrations = { path = "../integrations" }
mypaper-plugin-weather = { path = "../../plugins/weather" }

anyhow.workspace = true
log.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
mypaper-ui = { workspace = true, features = ["golden"] }

[lints]
workspace = true
