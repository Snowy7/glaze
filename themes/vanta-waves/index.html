<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'">
<title>Waves</title>
<style>html,body,#wallpaper,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#06090e}canvas{display:block}.dg{display:none!important}.credit{position:fixed;bottom:12px;right:16px;font:12px Arial,sans-serif;color:#fff9;text-shadow:0 1px 4px #000;pointer-events:none}</style>
<div id="wallpaper"></div><div class="credit">Teng Bao · Vanta.js · MIT</div>
<script src="three.r134.min.js"></script><script src="vanta.min.js"></script>
<script>
// Pace the upstream animation at 30 fps without changing its shaders or geometry.
const nativeFrame = window.requestAnimationFrame.bind(window);
window.requestAnimationFrame = callback => nativeFrame(time => {
  setTimeout(() => callback(time), 1000 / 30);
});
VANTA.WAVES({el:'#wallpaper', mouseControls:true, touchControls:false, gyroControls:false, minHeight:200, minWidth:200, scale:1, scaleMobile:1, color:0x245e78, shininess:35, waveHeight:15, waveSpeed:0.65});
</script>
</html>
