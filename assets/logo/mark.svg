<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Glaze</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <!-- A landscape sheet (a screen-shaped wallpaper) whose top-right corner is folded down. -->
    <path id="outline" d="M58 70 H170 L206 106 V176 Q206 190 192 190 H58 Q44 190 44 176 V84 Q44 70 58 70 Z"/>
    <clipPath id="page"><use href="#outline"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="3"/>

  <g transform="translate(128 128) scale(1.22) rotate(-7) translate(-125 -130)" filter="url(#lift)">
    <use href="#outline" fill="url(#sheet)"/>
    <!-- The wallpaper on it: a crescent moon over two rolling hills -->
    <g clip-path="url(#page)">
      <path d="M100 98 a19 19 0 1 0 22 28 a15 15 0 1 1 -22 -28 Z" fill="#141414"/>
      <path d="M44 156 C 70 132, 96 134, 120 148 S 172 164, 206 136 V190 H44 Z" fill="#4a4a4a"/>
      <path d="M44 176 C 78 156, 110 160, 136 170 S 182 180, 206 164 V190 H44 Z" fill="#121212"/>
    </g>
    <!-- The fold -->
    <path d="M170 70 V96 Q170 106 180 106 H206 Z" fill="url(#fold)"/>
  </g>
</svg>
