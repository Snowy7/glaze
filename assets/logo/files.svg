<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Glaze Files</title>
  <!-- Same tile, paper, tilt and lift as mark.svg; the folder silhouette sets Files apart. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#5c5c5c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e2e2"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <!-- The front panel casts a short shadow up onto the paper behind it. -->
    <filter id="front" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="3"/>

  <g transform="translate(128 128) scale(1.08) rotate(-7) translate(-128 -130)" filter="url(#lift)">
    <!-- Back panel with its tab -->
    <path d="M60 62 H96 Q103 62 107 68 L114 78 H196 Q208 78 208 90 V184 Q208 196 196 196 H60 Q48 196 48 184 V74 Q48 62 60 62 Z" fill="url(#back)"/>
    <!-- A sheet inside, with mark.svg's folded corner -->
    <path d="M72 90 H168 L186 108 V170 H66 V96 Q66 90 72 90 Z" fill="url(#paper)"/>
    <path d="M168 90 V102 Q168 108 174 108 H186 Z" fill="url(#fold)"/>
    <!-- Front panel -->
    <path d="M48 124 Q48 112 60 112 H196 Q208 112 208 124 V184 Q208 196 196 196 H60 Q48 196 48 184 Z" fill="url(#sheet)" filter="url(#front)"/>
  </g>
</svg>
