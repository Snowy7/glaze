# Fast dev loop. Everything here is dev-only; release builds use plain LLVM.

[unstable]
codegen-backend = true

[build]
rustflags = [
  "-Zthreads=8",          # parallel rustc frontend
  "-Zshare-generics=y",   # reuse monomorphized generics across crates
]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"   # much faster than link.exe

# Cranelift compiles our crates; deps stay on LLVM (optimized, built once).
[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"

[profile.release]
codegen-backend = "llvm"

[alias]
paper = "run -p glaze-wallpaper --"          # cargo paper --windowed themes/aurora
core = "run -p glaze-core --"                # cargo core themes/aurora

# Private git dependencies (stillkit) fetch through git, which has the GitHub credentials.
[net]
git-fetch-with-cli = true

# Build against the local stillkit checkout, so a change there shows up here without a rev bump.
# Remove these lines to build the pinned rev in Cargo.toml. (The vendored accesskit_windows always
# comes from the pinned rev: Cargo cannot patch a patch.)
[patch."https://github.com/Snowy7/stillkit"]
stillkit = { path = "D:/Coding/projects/desktop/stillkit/crates/stillkit" }
stillkit-glass = { path = "D:/Coding/projects/desktop/stillkit/crates/stillkit-glass" }
