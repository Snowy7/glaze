[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "tools/*"]
# WebAssembly guests build for wasm32-wasip2 in their own workspaces (docs/plugins.md).
# TypeScript guests (plugins/hello-ts) are pnpm projects, not crates.
exclude = ["plugins/obs", "plugins/grok", "plugins/hello", "plugins/docker", "plugins/weather/component", "plugins/hello-ts", "plugins/discord", "plugins/tailscale"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mypaper-glass-ipc = { path = "crates/glass-ipc" }
mypaper-theme = { path = "crates/theme" }
mypaper-config = { path = "crates/config" }
mypaper-desktop = { path = "crates/desktop" }
mypaper-inject = { path = "crates/inject" }
mypaper-tweaks = { path = "crates/tweaks" }
mypaper-bars = { path = "crates/bars" }
mypaper-ui = { path = "crates/ui" }

# Accessibility for the native UI (`crates/ui`); built on the same `windows` 0.62.
accesskit = "0.25"
accesskit_windows = "0.35"
# Direct2D takes its points as `Vector2`; the version `windows` 0.62 already uses.
windows-numerics = "0.3"
# Golden-image tests only (`mypaper-ui`'s `golden` feature).
png = "0.18"

anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DX12 only: no Vulkan/GL/Metal backends to compile or ship.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
windows = "0.62"
glam = { version = "0.34", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength"] }
# Rust hot-patching (opt-in via the `hotpatch` feature, driven by `dx serve --hotpatch`).
subsecond = "0.7.10"
dioxus-devtools = "0.7.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Our crates: Cranelift (see .cargo/config.toml) + incremental for fast rebuilds.
[profile.dev]
debug = "line-tables-only"

# Dependencies: compiled once with LLVM and optimized, so wgpu/naga run fast in dev.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

