[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "tools/*"]
# WebAssembly guests build for wasm32-wasip2 in their own workspaces (docs/plugins.md).
# TypeScript guests (plugins/hello-ts) are pnpm projects, not crates.
exclude = ["plugins/obs", "plugins/grok", "plugins/hello", "plugins/docker", "plugins/weather/component", "plugins/hello-ts", "plugins/discord", "plugins/tailscale", "plugins/t3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
glaze-glass-ipc = { path = "crates/glass-ipc" }
glaze-theme = { path = "crates/theme" }
glaze-config = { path = "crates/config" }
glaze-fswatch = { path = "crates/fswatch" }
glaze-index = { path = "crates/index" }
glaze-desktop = { path = "crates/desktop" }
glaze-inject = { path = "crates/inject" }
glaze-tweaks = { path = "crates/tweaks" }
glaze-bars = { path = "crates/bars" }
# The UI library, its own repo since 2026-11-07. .cargo/config.toml patches it to the sibling
# checkout at D:/Coding/projects/desktop/stillkit, so both change together on this PC.
glaze-ui = { package = "stillkit", git = "https://github.com/Snowy7/stillkit", rev = "5f9d05796c2492d7c08cac48f3eca4fedd927741" }

anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DX12 only: no Vulkan/GL/Metal backends to compile or ship.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
windows = "0.62"
glam = { version = "0.34", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength"] }
# Rust hot-patching (opt-in via the `hotpatch` feature, driven by `dx serve --hotpatch`).
subsecond = "0.7.10"
dioxus-devtools = "0.7.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Our crates: Cranelift (see .cargo/config.toml) + incremental for fast rebuilds.
[profile.dev]
debug = "line-tables-only"

# Dependencies: compiled once with LLVM and optimized, so wgpu/naga run fast in dev.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Studio's many native settings views favor a smaller resident code footprint.
[profile.release.package.glaze-studio]
opt-level = "s"


[patch.crates-io]
# stillkit's vendored adapter; Cargo applies only this workspace's patches.
accesskit_windows = { git = "https://github.com/Snowy7/stillkit", rev = "5f9d05796c2492d7c08cac48f3eca4fedd927741" }
