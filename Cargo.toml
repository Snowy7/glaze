[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mypaper-theme = { path = "crates/theme" }
mypaper-desktop = { path = "crates/desktop" }

anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DX12 only: no Vulkan/GL/Metal backends to compile or ship.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
windows = "0.62"
# Rust hot-patching (opt-in via the `hotpatch` feature, driven by `dx serve --hotpatch`).
subsecond = "0.7.10"
dioxus-devtools = "0.7.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Our crates: Cranelift (see .cargo/config.toml) + incremental for fast rebuilds.
[profile.dev]
debug = "line-tables-only"

# Dependencies: compiled once with LLVM and optimized, so wgpu/naga run fast in dev.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
