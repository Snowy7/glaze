<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Now playing</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card np" id="root" data-state="empty">
      <!-- The cover, shrunk to a few pixels once per track and blurred by scaling (look: backdrop). -->
      <div class="wash" aria-hidden="true"><img id="wash" alt="" /></div>
      <!-- A frosted plate behind the strip on a bare wallpaper. -->
      <div class="plate chip" aria-hidden="true"></div>

      <div class="body">
        <div class="cover">
          <div class="art">
            <img id="img" alt="" hidden />
            <svg class="note" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18V6l10-2v12" />
              <circle cx="6.5" cy="18" r="2.5" />
              <circle cx="16.5" cy="16" r="2.5" />
            </svg>
          </div>
          <!-- The play button that sits on the cover in the smallest layouts. -->
          <button class="over" id="over" aria-label="Play or pause" tabindex="-1">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" /></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg>
          </button>
        </div>

        <div class="info">
          <div class="eyebrow caps">
            <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="app ellipsis" id="app">Now playing</span>
          </div>
          <div class="title" id="title">Nothing playing</div>
          <div class="artist" id="artist">Start music in any app</div>
        </div>

        <!-- Display only: there is no seek API in the contract yet. When there is, make `.bar`
             clickable and draggable; the hover thumb already invites it. -->
        <div class="scrub">
          <span class="time num" id="pos">0:00</span>
          <div class="bar">
            <div class="track"><i id="fill"></i></div>
            <b class="thumb" id="thumb"></b>
          </div>
          <span class="time num" id="rem">-0:00</span>
        </div>

        <div class="controls">
          <button class="skip" id="prev" aria-label="Previous track" title="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 5v14M19 5.5v13L9 12z" /></svg>
          </button>
          <button class="btn primary play" id="toggle" aria-label="Play or pause" title="Play / pause">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" /></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg>
          </button>
          <button class="skip" id="next" aria-label="Next track" title="Next">
            <svg viewBox="0 0 24 24"><path d="M18 5v14M5 5.5v13L15 12z" /></svg>
          </button>
        </div>
      </div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
