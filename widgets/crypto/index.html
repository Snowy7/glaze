<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crypto</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card">
      <div class="rows" id="rows"></div>
      <!-- "No coins set", "Loading", "Offline". -->

        <div class="msg-icon tile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M9.6 9.2h4.1a1.7 1.7 0 0 1 0 3.4h-3.4a1.7 1.7 0 0 0 0 3.4h4.3M12 7v2.2M12 16v2.2" />
          </svg>
        </div>
        <span id="msg-text"></span>
      </div>
      <div class="foot caps num" id="foot" hidden></div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
