<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Now playing pill</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The .card is the capsule itself (style.css makes it one). With surface none the kit paints no
         card, so .cap, a .tile, gives the capsule its body there. The progress hairline sits under
         the artist, inside the text column. -->
    <main class="card" id="card" data-idle>
      <span class="cap tile"></span>
      <div class="art" id="art">
        <img id="cover" alt="" draggable="false" hidden />
        <svg class="note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V6l10-2v12" />
          <circle cx="6.5" cy="18" r="2.5" />
          <circle cx="16.5" cy="16" r="2.5" />
        </svg>
      </div>
      <div class="meta" id="meta">
        <div class="title" id="title"><span class="mq" id="mq"></span></div>
        <div class="artist ellipsis" id="artist"></div>
        <div class="hair track" aria-hidden="true"><i id="bar"></i></div>
      </div>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <div class="ctl">
        <button class="prev" id="prev" aria-label="Previous track" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <path d="M6.5 6.5v11" fill="none" />
            <path d="M18 6.5v11L9.5 12z" />
          </svg>
        </button>
        <button class="play" id="play" aria-label="Play or pause" title="Play / pause">
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
            <path d="M8.5 5.8v12.4l10-6.2z" />
          </svg>
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
            <rect x="6.8" y="5.8" width="3.8" height="12.4" rx="1.2" />
            <rect x="13.4" y="5.8" width="3.8" height="12.4" rx="1.2" />
          </svg>
        </button>
        <button class="next" id="next" aria-label="Next track" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <path d="M17.5 6.5v11" fill="none" />
            <path d="M6 6.5v11l8.5-5.5z" />
          </svg>
        </button>
      </div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
