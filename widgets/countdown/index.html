<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Countdown</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card" role="group" data-layout="digits">
      <div class="ring-wrap" aria-hidden="true">
        <div class="disc tile"></div>
        <svg class="ring" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="arc-grad" x1="0" y1="0" x2="1" y2="1">
              <stop class="g0" offset="0" />
              <stop class="g1" offset="1" />
            </linearGradient>
          </defs>
          <circle class="trk" cx="50" cy="50" r="46" />
          <!-- Starts at 12 o'clock and runs clockwise without a rotation, so the gradient stays put. -->
          <path class="arc glow" id="arc" d="M50 4a46 46 0 1 1 0 92a46 46 0 1 1 0-92" pathLength="100" />
        </svg>
        <div class="center">
          <span class="v hero num" id="rv"></span>
          <span class="l caps" id="rl"></span>
        </div>
      </div>
      <div class="info">
        <p class="title caps ellipsis" id="title"></p>
        <div class="units num" id="units"></div>
        <p class="msg hero" id="msg" hidden></p>
        <div class="track bar" id="bar"><i id="bar-fill"></i></div>
        <p class="foot ellipsis" id="foot"></p>
      </div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
