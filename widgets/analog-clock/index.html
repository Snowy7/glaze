<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analog Clock</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card">
      <div class="dial-box">
        <div class="dial">
          <!-- The dial's body: a kit tile turned into a disc, so every style lights it its own way. -->
          <div class="face tile" aria-hidden="true"></div>
          <svg class="clock" id="clock" viewBox="0 0 100 100" role="img" aria-label="Clock">
            <defs>
              <!-- In the hand's own (unrotated) coordinates, so it turns with the hand: tail to tip. -->
              <linearGradient id="sec-grad" gradientUnits="userSpaceOnUse" x1="50" y1="63" x2="50" y2="9">
                <stop class="g0" offset="0" />
                <stop class="g1" offset="1" />
              </linearGradient>
            </defs>
            <circle class="ring" cx="50" cy="50" r="48.5" />
            <g id="ticks"></g>
            <g id="numerals"></g>
            <rect class="date-bg" id="date-bg" x="39" y="65.6" width="22" height="6.8" rx="3.4" />
            <text class="date" id="date" x="50" y="69"></text>
            <g class="hands">
              <line class="hand hour" id="hour" x1="50" y1="57" x2="50" y2="27" />
              <line class="hand minute" id="minute" x1="50" y1="58" x2="50" y2="11" />
              <line class="hand sec glow" id="sec" x1="50" y1="63" x2="50" y2="9" />
            </g>
            <circle class="hub" cx="50" cy="50" r="2.4" />
            <circle class="hub-sec" id="hub-sec" cx="50" cy="50" r="1.2" />
          </svg>
        </div>
      </div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
