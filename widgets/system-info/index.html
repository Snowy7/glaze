<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System info</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- One glyph per row (<use href="#i-<row id>">), drawn as 1.7px strokes on a 24px grid. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-uptime" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M12 7.5V12l3 2" />
        </symbol>
        <symbol id="i-cpu" viewBox="0 0 24 24">
          <rect x="7" y="7" width="10" height="10" rx="2" />
          <path d="M10 3.5V7M14 3.5V7M10 17v3.5M14 17v3.5M3.5 10H7M3.5 14H7M17 10h3.5M17 14h3.5" />
        </symbol>
        <symbol id="i-ram" viewBox="0 0 24 24">
          <rect x="3" y="7" width="18" height="9" rx="2" />
          <path d="M7 10.5v2M11 10.5v2M15 10.5v2M7 16v3M12 16v3M17 16v3" />
        </symbol>
        <symbol id="i-gpu" viewBox="0 0 24 24">
          <rect x="3" y="6.5" width="18" height="11" rx="2" />
          <circle cx="9.5" cy="12" r="2.6" />
          <path d="M15 10.5h3M15 13.5h3" />
        </symbol>
        <symbol id="i-disk" viewBox="0 0 24 24">
          <path d="M5.2 5h13.6a1 1 0 0 1 .95.68L21 11v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6l1.25-5.32A1 1 0 0 1 5.2 5zM3 11h18" />
          <circle cx="16.5" cy="15" r=".6" />
        </symbol>
        <symbol id="i-network" viewBox="0 0 24 24">
          <path d="M2.81 10.01A13 13 0 0 1 21.19 10.01M5.64 12.84A9 9 0 0 1 18.36 12.84M8.46 15.66A5 5 0 0 1 15.54 15.66" />
          <circle cx="12" cy="19.2" r="1" />
        </symbol>
        <symbol id="i-battery" viewBox="0 0 24 24">
          <rect x="2.5" y="7.5" width="16" height="9" rx="2.4" />
          <path d="M21.5 11v2M6.5 12h5" />
        </symbol>
      </defs>
    </svg>
    <main class="card" id="card">
      <header class="head" id="head">
        <!-- An abstract mark (a ring, a diamond, a dot), not anyone's logo. -->
        <span class="mark tile">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9.5" />
            <path d="M12 6.5 17.5 12 12 17.5 6.5 12z" />
            <circle class="dot" cx="12" cy="12" r="1.4" />
          </svg>
        </span>
        <span class="title">This PC</span>
      </header>
      <div class="rows" id="rows"></div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
