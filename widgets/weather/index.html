<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Line icons, one <symbol> per condition (the plugin's `icon` names). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="cloud" viewBox="0 0 24 24">
          <path d="M7.5 15.5h9a3.25 3.25 0 0 0 .4-6.47 4.75 4.75 0 0 0-9.2 1.2A3.75 3.75 0 0 0 7.5 15.5z" />
        </symbol>
        <symbol id="sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" />
        </symbol>
        <symbol id="moon" viewBox="0 0 24 24">
          <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.2 8.2 0 1 0 20 14.2z" />
        </symbol>
        <symbol id="clear-day" viewBox="0 0 24 24"><use href="#sun" /></symbol>
        <symbol id="clear-night" viewBox="0 0 24 24"><use href="#moon" /></symbol>
        <symbol id="partly-cloudy-day" viewBox="0 0 24 24">
          <circle cx="8" cy="8" r="2.8" />
          <path d="M8 2.6v1.2M2.6 8h1.2M4.2 4.2l.9.9M11.8 4.2l-.9.9M4.2 11.8l.9-.9" />
          <g transform="translate(3.4 4.6) scale(.82)"><use href="#cloud" /></g>
        </symbol>
        <symbol id="partly-cloudy-night" viewBox="0 0 24 24">
          <path d="M11 6.3A4.4 4.4 0 0 1 6.2 2.1 4.4 4.4 0 1 0 11 6.3z" />
          <g transform="translate(3.4 4.6) scale(.82)"><use href="#cloud" /></g>
        </symbol>
        <symbol id="cloudy" viewBox="0 0 24 24"><g transform="translate(0 2)"><use href="#cloud" /></g></symbol>
        <symbol id="fog" viewBox="0 0 24 24">
          <path d="M5 8h14M3 12h14M7 16h14M5 20h10" />
        </symbol>
        <symbol id="drizzle" viewBox="0 0 24 24">
          <use href="#cloud" />
          <path d="M8 19v.01M12 19v.01M16 19v.01M10 22v.01M14 22v.01" stroke-width="2.2" />
        </symbol>
        <symbol id="rain" viewBox="0 0 24 24">
          <use href="#cloud" />
          <path d="M8.5 18l-1 3M12.5 18l-1 3M16.5 18l-1 3" />
        </symbol>
        <symbol id="snow" viewBox="0 0 24 24">
          <use href="#cloud" />
          <path d="M8 18.5v.01M12 18.5v.01M16 18.5v.01M10 21.5v.01M14 21.5v.01" stroke-width="2.6" />
        </symbol>
        <symbol id="thunderstorm" viewBox="0 0 24 24">
          <use href="#cloud" />
          <path d="M12.8 15.8l-2.6 3.4h3.2l-1.6 3" />
        </symbol>
      </defs>
    </svg>

    <main class="card" id="card" data-layout="tiny" data-state="loading">
      <section class="now">
        <svg class="icon" id="icon" aria-hidden="true"><use id="icon-use" href="#cloudy" /></svg>
        <div class="temp num" id="temp">--</div>
        <div class="meta">
          <div class="cond ellipsis" id="cond">Loading</div>
          <div class="place ellipsis" id="place"></div>
          <div class="range num ellipsis" id="range"></div>
        </div>
      </section>
      <section class="days" id="days"></section>
      <div class="status" id="status" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#cloudy" /></svg>
        <div id="status-text"></div>
      </div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
