<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Network</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card" data-kind="unknown" data-spark="on" data-bars="4">
      <header class="id">
        <!-- One glyph, three faces (data-kind): wifi arcs lit by signal, an ethernet plug, a struck-out wifi. -->
        <span class="badge tile">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <g class="wifi">
              <path class="a3" d="M2.81 10.01A13 13 0 0 1 21.19 10.01" />
              <path class="a2" d="M5.64 12.84A9 9 0 0 1 18.36 12.84" />
              <path class="a1" d="M8.46 15.66A5 5 0 0 1 15.54 15.66" />
              <circle class="dot" cx="12" cy="19.2" r="1.3" />
            </g>
            <g class="ethernet">
              <path d="M6 4h12v9h-3v3H9v-3H6zM9 7v3M12 7v3M15 7v3M12 16v4" />
            </g>
            <path class="slash" d="M4.5 4.5 19.5 19.5" />
          </svg>
        </span>
        <div class="who">
          <span class="name ellipsis" id="name"></span>
          <span class="sub caps ellipsis" id="sub"></span>
        </div>
      </header>

      <!-- Two minutes of traffic, newest on the right; `peak` is the scale (never below 256 KB/s). -->
      <div class="graph tile">
        <svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
          <path class="area down" id="area"></path>
          <path class="area up" id="area-up"></path>
          <path class="line down" id="down-line"></path>
          <path class="line up" id="up-line"></path>
        </svg>
        <span class="peak caps num" id="peak"></span>
      </div>

      <div class="rates">
        <div class="rate down">
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6.5 13.5 12 19l5.5-5.5" /></svg>
          <span class="lab caps">Down</span>
          <span class="val num"><b class="hero" id="down-n">-</b><small id="down-u"></small></span>
        </div>
        <div class="rate up">
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" /></svg>
          <span class="lab caps">Up</span>
          <span class="val num"><b id="up-n">-</b><small id="up-u"></small></span>
        </div>
      </div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
