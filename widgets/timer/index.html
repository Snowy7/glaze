<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timer</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card" data-layout="stack" data-modes="on" data-state="idle">
      <div class="dial-box">
        <div class="dial" id="dial">
          <div class="disc tile" aria-hidden="true"></div>
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="arc-grad" x1="0" y1="0" x2="1" y2="1">
                <stop class="g0" offset="0" />
                <stop class="g1" offset="1" />
              </linearGradient>
            </defs>
            <!-- Both start at 12 o'clock and run clockwise, so the gradient stays put while the arc grows. -->
            <path class="halo" d="M50 4a46 46 0 1 1 0 92a46 46 0 1 1 0-92" />
            <circle class="ring-track" cx="50" cy="50" r="46" />
            <path class="prog glow" id="prog" d="M50 4a46 46 0 1 1 0 92a46 46 0 1 1 0-92" pathLength="100" />
          </svg>
          <div class="center">
            <span class="mode-name caps" id="label"></span>
            <span class="time hero num" id="time" role="timer">25:00</span>
            <span class="dots" id="dots" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div class="side" id="side">
        <div class="modes" id="modes" role="tablist" aria-label="Mode">
          <button class="seg" type="button" role="tab" data-mode="focus">Focus</button>
          <button class="seg" type="button" role="tab" data-mode="short">Short</button>
          <button class="seg" type="button" role="tab" data-mode="long">Long</button>
          <button class="seg" type="button" role="tab" data-mode="custom">Custom</button>
        </div>
        <div class="controls" id="controls">
          <button class="btn round reset" id="reset" type="button" aria-label="Reset">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5" /><path d="M4.5 4.5v4h4" /></svg>
          </button>
          <button class="btn round primary play" id="play" type="button" aria-label="Start">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4a.6.6 0 0 0 .9.5l9.6-6.2a.6.6 0 0 0 0-1L9.4 5.3a.6.6 0 0 0-.9.5Z" /></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9 6.5v11M15 6.5v11" /></svg>
          </button>
          <button class="btn round skip" id="skip" type="button" aria-label="Next session">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5 14 12l-7.5 5.5ZM18 6.5v11" /></svg>
          </button>
        </div>
      </div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
