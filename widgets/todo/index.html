<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To do</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card" data-add="bottom">
      <header class="head">
        <span class="caps title" id="title">To do</span>
        <span class="count chip num" id="count"></span>
      </header>
      <div class="track bar" id="bar" hidden><i id="bar-fill"></i></div>
      <div class="scroller" id="scroller">
        <ul class="list tile" id="list"></ul>
        <div class="empty" id="empty" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M8.2 12.3l2.6 2.6 5-5.6" /></svg>
          <p id="empty-text"></p>
        </div>
      </div>
      <label class="field add" id="add-box">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" /></svg>
        <input id="add" type="text" placeholder="Add a task" aria-label="Add a task" maxlength="240" autocomplete="off" spellcheck="false" disabled />
      </label>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
