<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card">
      <div class="frame" id="frame" data-fit="cover" data-motion="still">
        <img class="layer" id="a" alt="" draggable="false" />
        <img class="layer" id="b" alt="" draggable="false" />
        <div class="caption caps ellipsis" id="caption" hidden></div>
        <!-- No images, or none that load. -->
        <div class="hint" id="hint" hidden>
          <div class="hint-icon tile">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5" width="17" height="14" rx="2.6" />
              <circle cx="9" cy="10" r="1.6" />
              <path d="M4 17.2l4.4-4.4a1.5 1.5 0 0 1 2.1 0l3.4 3.4 1.7-1.7a1.5 1.5 0 0 1 2.1 0l2.3 2.3" />
            </svg>
          </div>
          <div class="hint-title" id="hint-title"></div>
          <div class="hint-sub caps" id="hint-sub"></div>
        </div>
      </div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
