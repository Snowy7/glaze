<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Disks</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Shared artwork: the arc gradients (highlight pair, warning pair) and the drive glyph. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="g-hi" x1="0" y1="0" x2="1" y2="1">
          <stop class="hi" offset="0" />
          <stop class="hi-2" offset="1" />
        </linearGradient>
        <linearGradient id="g-warn" x1="0" y1="0" x2="1" y2="1">
          <stop class="warn" offset="0" />
          <stop class="warn-2" offset="1" />
        </linearGradient>
        <symbol id="i-drive" viewBox="0 0 24 24">
          <path d="M5.2 5h13.6a1 1 0 0 1 .95.68L21 11v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6l1.25-5.32A1 1 0 0 1 5.2 5zM3 11h18" />
          <circle cx="16.5" cy="15" r=".6" />
        </symbol>
      </defs>
    </svg>
    <main class="card">
      <!-- The drives scroll inside the card when they don't fit; a soft fade hints at it. -->
      <div class="list" id="list" data-variant="bars"></div>
      <div class="empty" id="empty" hidden>
        <div class="empty-icon tile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drive" /></svg>
        </div>
        <span class="caps" id="empty-text"></span>
      </div>
    </main>
    <script src="mypaper.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
