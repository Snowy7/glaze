<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mypaper widget gallery</title>
    <link rel="stylesheet" href="./harness.css" />
    <style>
      html, body { height: auto; overflow: visible; }
      body { display: block; background: #000; }
      .sheet { display: flex; flex-direction: column; gap: 0; }
      .stage { position: relative; padding: 18px 18px 22px; }
      .stage > .head { position: absolute; left: 18px; top: 4px; font: 10px/1 ui-monospace, Consolas, monospace; color: rgb(255 255 255 / 0.7); mix-blend-mode: difference; }
      .rowline { display: flex; align-items: flex-start; gap: 18px; margin-top: 14px; }
      .cell { position: relative; flex: 0 0 auto; }
      .cell iframe { display: block; border: 0; background: transparent; }
      .cell .tag { position: absolute; left: 0; top: -11px; font: 9px/1 ui-monospace, Consolas, monospace; color: rgb(255 255 255 / 0.65); mix-blend-mode: difference; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="sheet" id="sheet"></div>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
