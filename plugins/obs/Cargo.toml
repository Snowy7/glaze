[package]
name = "obs-component"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "obs"
crate-type = ["cdylib", "rlib"]

[dependencies]
mypaper-plugin-sdk = { path = "../../crates/plugin-sdk" }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
