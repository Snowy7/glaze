[package]
name = "mypaper-plugin-weather"
description = "Weather plugin for mypaper widgets: open-meteo, no API key (JSON-RPC over stdio)."
version.workspace = true
edition.workspace = true
license.workspace = true

# plugin.json says `"command": "weather.exe"`.
[[bin]]
name = "weather"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Devices_Geolocation", "Foundation", "Networking_Connectivity", "Win32_System_WinRT", "Win32_Networking_WinHttp"] }

[lints]
workspace = true
