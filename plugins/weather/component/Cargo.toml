# The weather plugin's WebAssembly component (docs/plugins.md): its faces. The native
# `weather.exe` beside it still serves the built-in weather widget's data calls.
# Its own workspace: built for wasm32-wasip2 by scripts/build-plugins.ps1 into ../weather.wasm.
[package]
name = "weather-component"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "weather"
crate-type = ["cdylib"]

[dependencies]
mypaper-plugin-sdk = { path = "../../../crates/plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
