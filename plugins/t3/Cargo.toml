# T3 Code as a WebAssembly component (docs/plugins.md). Its own workspace: built for
# wasm32-wasip2 by scripts/build-plugins.ps1 into t3.wasm; `cargo test` runs the model and
# view goldens on the host.
[package]
name = "t3-component"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "t3"
crate-type = ["cdylib", "rlib"]

[dependencies]
mypaper-plugin-sdk = { path = "../../crates/plugin-sdk" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
