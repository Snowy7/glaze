[package]
name = "discord-component"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "discord"
crate-type = ["cdylib", "rlib"]

[dependencies]
mypaper-plugin-sdk = { path = "../../crates/plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
